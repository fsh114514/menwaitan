name: build-and-push

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', 'lib/**', 'skills/**', 'public/**', 'Dockerfile', 'package.json', 'next.config.ts']

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/menwaitan:latest
